name: repro

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  plain-step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stop the runner inside a plain step
        run: .github/stop-runner.sh

  composite-last-step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stop the runner inside a composite step
        uses: ./.github/actions/stop-runner

  composite-step-with-next-step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stop the runner inside a composite step that has a step after it
        uses: ./.github/actions/stop-runner-then-step
